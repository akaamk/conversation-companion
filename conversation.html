<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversation Companion</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="conversation-page">
  <main>
    <h1>Conversation Companion</h1>
    <button id="start" class="start-button">Start</button>
    <div id="orb" class="orb" hidden aria-hidden="true"></div>
    <p id="status" class="status" aria-live="polite"></p>
    <p id="interrupt-hint" class="hint" hidden>Tap anywhere to interrupt</p>
    <p id="debug" class="debug" hidden></p>
    <p id="problem" class="notice problem" role="alert" hidden></p>
    <p id="not-set-up" class="notice" hidden>Before the first conversation, a family member answers a few questions about their loved one. <a href="/questionnaire.html">Go to the questionnaire</a></p>
  </main>
  <script src="/js/demo-answers.js"></script>
  <script src="/js/voices.js"></script>
  <script src="/js/conversation.js"></script>
</body>
</html>
